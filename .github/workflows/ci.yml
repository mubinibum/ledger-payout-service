# CI pipeline. Prepared locally; not yet connected to a remote (see
# docs/PUBLIC_RELEASE_CHECKLIST.md). When the repo is pushed to GitHub this runs on every
# push to main and every pull request.
#
# SUPPLY-CHAIN NOTES
#   - Least privilege: read-only by default (`permissions: contents: read`); only the
#     CodeQL job widens its own permissions, and only to write security events.
#   - Action pinning (M4.1): every `uses:` — first-party and third-party — is pinned to a
#     full 40-character immutable commit SHA, resolved read-only from each action's
#     upstream repository via `gh api repos/<owner>/<repo>/commits/<tag>`. The human-readable
#     version is kept as a trailing comment. Re-resolve and re-pin when bumping a version.
#     `scripts/check-workflow.mjs` statically enforces that every `uses:` is SHA-pinned.
#   - No secrets are referenced, so fork pull requests run the full pipeline safely. Nothing
#     is uploaded except a non-sensitive SBOM and CodeQL SARIF.
#   - Hard gates (production `npm audit`, gitleaks, proprietary scan, Trivy fs/config/image,
#     license check) never use `|| true` or `continue-on-error`. The dev-dependency audit is
#     informational with a documented reason — see docs/DEPENDENCY_LICENSE_REVIEW.md.
#   - Secret scanning (M4.2.1) calls the gitleaks CLI directly — see the comment on the
#     secret-scan job for why gitleaks/gitleaks-action was dropped. The binary is fetched
#     from an official GitHub release, pinned to an explicit version, and checksum-verified
#     against gitleaks' own published SHA-256 file before it is ever executed — no installer
#     is piped to a shell.
#   - Trivy (aquasecurity/trivy-action) is pinned to v0.36.0 after v0.28.0's pinned SHA broke:
#     that release's own composite action referenced aquasecurity/setup-trivy by a moving
#     tag that was later deleted upstream. v0.36.0 pins its internal setup-trivy and
#     actions/cache dependencies by SHA, which is the correct pattern and was verified
#     read-only before pinning.

name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0 # full history for gitleaks

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '20.20.2'
          cache: 'npm'

      - run: npm ci --no-audit --no-fund

      - name: Format
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: OpenAPI — valid & in sync with routes
        run: npm run openapi:check

      - name: Docs — no broken local links
        run: npm run docs:links

      - name: Proprietary / secret scan (working tree)
        run: npm run scan:proprietary

      - name: Static workflow checks
        run: node scripts/check-workflow.mjs

      - name: Unit tests
        run: npm run test:unit

      - name: Integration + failure-injection + concurrency tests
        run: npm test # PostgreSQL + Redis via Testcontainers

      - name: Build
        run: npm run build

      - name: Validate docker-compose
        run: docker compose config -q

      - name: Migrations — fresh, rerun, down/up round-trip
        env:
          DATABASE_URL: postgres://ledger:ci@127.0.0.1:5432/ledger
        run: |
          docker run -d --name pg -e POSTGRES_USER=ledger -e POSTGRES_PASSWORD=ci \
            -e POSTGRES_DB=ledger -p 5432:5432 postgres:16-alpine
          for i in $(seq 1 30); do docker exec pg pg_isready -U ledger && break; sleep 1; done
          npm run migrate:up
          npm run migrate:up          # idempotent
          npm run migrate:status
          npm run migrate:down && npm run migrate:down && npm run migrate:up
          docker rm -f pg

      - name: Dependency audit — production deps (HARD GATE)
        run: npm audit --omit=dev --audit-level=low

      - name: Dependency audit — dev deps (informational)
        run: npm audit || echo "accepted dev-only advisories — see docs/DEPENDENCY_LICENSE_REVIEW.md"

      - name: Dependency licenses — no copyleft / unlicensed (HARD GATE)
        run: node scripts/check-licenses.mjs

      - name: Generate SBOM (CycloneDX, production scope)
        run: npm run sbom

      - name: Upload SBOM
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: sbom
          path: sbom.json
          if-no-files-found: error

  secret-scan:
    # Calls the gitleaks CLI directly instead of gitleaks/gitleaks-action (M4.2.1). The
    # action's push-event diff heuristic computes a commit range from `before`..`after`;
    # on the very first push of full history to a previously-empty repo, `before` resolves
    # to the root commit and the action asks git for `<root>^..<head>`, which is invalid
    # (the root commit has no parent) and fails the whole job. Running gitleaks ourselves
    # scans the actual reachable history deterministically and sidesteps that heuristic
    # entirely — the same command already verified clean locally throughout M4-M4.2.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0 # full history — required for the scan below to see every commit

      - name: Install gitleaks (pinned release, checksum-verified — HARD GATE prerequisite)
        env:
          GITLEAKS_VERSION: '8.30.1'
        run: |
          set -euo pipefail
          base="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          asset="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL -O "$base/gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          curl -sSfL -O "$base/$asset"
          grep " ${asset}\$" "gitleaks_${GITLEAKS_VERSION}_checksums.txt" > gitleaks.sha256
          sha256sum -c gitleaks.sha256
          tar xzf "$asset" gitleaks
          chmod +x gitleaks

      - name: gitleaks — full reachable history (HARD GATE, deterministic CLI scan)
        run: |
          set -euo pipefail
          ./gitleaks detect --source . --log-opts="--all" --redact --exit-code 1

  filesystem-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Trivy — filesystem vulns + secrets (HARD GATE on HIGH/CRITICAL)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scanners: vuln,secret
          severity: HIGH,CRITICAL
          exit-code: '1'
          ignore-unfixed: true
      - name: Trivy — IaC / config misconfiguration (HARD GATE)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: config
          severity: HIGH,CRITICAL
          exit-code: '1'

  codeql:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: github/codeql-action/init@6f5948dfacef28e207b48d0905cf90c03365536d # v3.37.9
        with:
          languages: javascript-typescript
      - uses: github/codeql-action/analyze@6f5948dfacef28e207b48d0905cf90c03365536d # v3.37.9

  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Build production image
        run: docker build -t ledger-payout-service:ci .
      - name: Verify image runs as non-root
        run: |
          uid=$(docker run --rm --entrypoint id ledger-payout-service:ci -u)
          test "$uid" != "0" || { echo "image runs as root"; exit 1; }
      - name: Verify no dev/test/secret files in the image
        run: |
          docker run --rm --entrypoint sh ledger-payout-service:ci -c '
            for p in /app/test /app/.git /app/.env /app/src; do
              if [ -e "$p" ]; then echo "unexpected $p in image"; exit 1; fi
            done'
      - name: Trivy — container image (HARD GATE on HIGH/CRITICAL)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: ledger-payout-service:ci
          severity: HIGH,CRITICAL
          exit-code: '1'
          ignore-unfixed: true
