# CI pipeline. Prepared locally in M1; not yet connected to a remote.
# When the repo is pushed to GitHub this runs on every push and pull request.
name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - run: npm ci

      - name: Format
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm run test:unit

      - name: Integration + concurrency tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Validate docker-compose
        run: docker compose config -q

      - name: Proprietary-term scan
        run: npm run scan:proprietary

      - name: Fresh migration from zero
        env:
          DATABASE_URL: postgres://ledger:ci@127.0.0.1:5432/ledger
        run: |
          docker run -d --name pg -e POSTGRES_USER=ledger -e POSTGRES_PASSWORD=ci \
            -e POSTGRES_DB=ledger -p 5432:5432 postgres:16-alpine
          for i in $(seq 1 30); do docker exec pg pg_isready -U ledger && break; sleep 1; done
          npm run migrate:up
          npm run migrate:status
          docker rm -f pg

      - name: Dependency audit (production deps)
        run: npm audit --omit=dev

      - name: Secret scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: 'false'
